<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title description" font-family="Arial, sans-serif"><title id="title">Lab 6: ACL Traffic Control</title><desc id="description">PC1/PC2 connect to Switch0 Fa0/1–2 in VLAN 10; PC3/PC4 to Fa0/3–4 in VLAN 20. Server0 FastEthernet0 connects to Fa0/5 in Services VLAN 30, static 192.168.30.10/24. Switch0 Gi0/1 trunks tagged VLANs 10, 20, and 30 to Router0 G0/0. Router0 subinterfaces .10, .20, .30 use the respective 192.168.VLAN.1/24 gateways. Router0 relays DHCP on .10 and .20 to 192.168.30.10. Router0 G0/1 at 192.168.0.1/30 connects to Router1 G0/0 at 192.168.0.2/30. Router1 now also routes Services via 192.168.0.1. VLAN10-IN is inbound on G0/0.10; VLAN20-IN is inbound on G0/0.20. These block routed Sales-to-HR traffic in both directions while preserving same-VLAN switching, DHCP, DNS, Server0, and Router1 access.</desc><rect width="1400" height="780" fill="#ffffff" /><text x="22" y="30" fill="#17364c" font-size="20" text-anchor="start" font-weight="bold">Lab 6 topology — schematic</text><rect x="20" y="65" width="425" height="185" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="232" y="96" fill="#17364c" font-size="20" text-anchor="middle" font-weight="bold">Router0 ACL policy</text><text x="232" y="126" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">VLAN10-IN: inbound on G0/0.10</text><text x="232" y="156" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">VLAN20-IN: inbound on G0/0.20</text><text x="232" y="186" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Deny Sales ↔ HR routed traffic</text><text x="232" y="216" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Permit other IPv4 traffic</text><line x1="915" y1="120" x2="1045" y2="120" stroke="#7c4e91" stroke-width="4" /><text x="1195" y="35" fill="#7c4e91" font-size="17" text-anchor="middle" font-weight="normal">Transit: 192.168.0.0/30</text><rect x="485.0" y="65" width="430" height="185" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="700" y="94" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Router0 (Cisco 2911)</text><text x="700" y="124" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/1: 192.168.0.1/30</text><text x="700" y="154" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0.10: 192.168.10.1/24</text><text x="700" y="184" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0.20: 192.168.20.1/24</text><text x="700" y="214" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0.30: 192.168.30.1/24</text><rect x="1045.0" y="65" width="330" height="185" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="1210" y="94" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Router1 (Cisco 2911)</text><text x="1210" y="124" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0: 192.168.0.2/30</text><text x="1210" y="154" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Return to VLAN 10/20/30</text><text x="1210" y="184" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">via 192.168.0.1</text><line x1="700" y1="250" x2="700" y2="365" stroke="#235fa4" stroke-width="4" /><text x="720" y="282" fill="#17364c" font-size="18" text-anchor="start" font-weight="normal">Router0 G0/0 (no parent IP)</text><text x="720" y="345" fill="#17364c" font-size="18" text-anchor="start" font-weight="normal">Switch0 Gi0/1</text><text x="680" y="300" fill="#235fa4" font-size="18" text-anchor="end" font-weight="normal">802.1Q trunk</text><text x="680" y="325" fill="#235fa4" font-size="16" text-anchor="end" font-weight="normal">Tagged VLANs 10, 20, 30</text><rect x="530.0" y="365" width="340" height="78" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="700" y="394" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Switch0 (Cisco 2960)</text><text x="700" y="424" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Access ports Fa0/1–Fa0/5</text><line x1="700" y1="443" x2="700" y2="495" stroke="#36728b" stroke-width="3" /><line x1="140" y1="495" x2="1260" y2="495" stroke="#36728b" stroke-width="3" /><rect x="20" y="530" width="530" height="195" rx="12" fill="#edf7fa" stroke="#7ba7b7" stroke-width="2" /><text x="285.0" y="557" fill="#17364c" font-size="20" text-anchor="middle" font-weight="bold">Sales — VLAN 10</text><rect x="580" y="530" width="530" height="195" rx="12" fill="#fff5e8" stroke="#bba07d" stroke-width="2" /><text x="845.0" y="557" fill="#17364c" font-size="20" text-anchor="middle" font-weight="bold">HR — VLAN 20</text><rect x="1130" y="530" width="250" height="195" rx="12" fill="#f0f5ec" stroke="#86a478" stroke-width="2" /><text x="1255.0" y="557" fill="#17364c" font-size="20" text-anchor="middle" font-weight="bold">Services — VLAN 30</text><line x1="140" y1="495" x2="140" y2="585" stroke="#36728b" stroke-width="3" /><text x="152" y="579" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Fa0/1</text><rect x="25.0" y="585" width="230" height="114" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="140" y="614" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC1 (PC-PT)</text><text x="140" y="644" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">DHCP: 192.168.10.x/24</text><text x="140" y="674" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="420" y1="495" x2="420" y2="585" stroke="#36728b" stroke-width="3" /><text x="432" y="579" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Fa0/2</text><rect x="305.0" y="585" width="230" height="114" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="420" y="614" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC2 (PC-PT)</text><text x="420" y="644" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">DHCP: 192.168.10.x/24</text><text x="420" y="674" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="700" y1="495" x2="700" y2="585" stroke="#36728b" stroke-width="3" /><text x="712" y="579" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Fa0/3</text><rect x="585.0" y="585" width="230" height="114" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="700" y="614" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC3 (PC-PT)</text><text x="700" y="644" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">DHCP: 192.168.20.x/24</text><text x="700" y="674" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="980" y1="495" x2="980" y2="585" stroke="#36728b" stroke-width="3" /><text x="992" y="579" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Fa0/4</text><rect x="865.0" y="585" width="230" height="114" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="980" y="614" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC4 (PC-PT)</text><text x="980" y="644" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">DHCP: 192.168.20.x/24</text><text x="980" y="674" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="1260" y1="495" x2="1260" y2="585" stroke="#36728b" stroke-width="3" /><text x="1272" y="579" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Fa0/5</text><rect x="1145.0" y="585" width="230" height="114" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="1260" y="614" fill="#17364c" font-size="19" text-anchor="middle" font-weight="bold">Server0 (Server-PT)</text><text x="1260" y="644" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">192.168.30.10/24</text><text x="1260" y="674" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Fa0; DHCP + DNS</text><text x="22" y="750" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">All cables are copper straight-through. Client gateways remain .1 in their VLAN; Server0 gateway: 192.168.30.1.</text><text x="22" y="773" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Read current DHCP addresses with ipconfig. ACLs do not filter same-VLAN switching.</text></svg>