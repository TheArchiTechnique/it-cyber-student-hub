<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title description" font-family="Arial, sans-serif"><title id="title">Lab 4: DHCP Configuration</title><desc id="description">PC1 and PC2 use DHCP in Sales VLAN 10 through Switch0 Fa0/1 and Fa0/2. PC3 and PC4 use DHCP in HR VLAN 20 through Fa0/3 and Fa0/4. Switch0 Gi0/1 trunks to Router0 G0/0, tagged VLANs 10 and 20. Router0 gateways are 192.168.10.1/24 and 192.168.20.1/24. Router0 provides both DHCP pools. Router0 G0/1 at 192.168.0.1/30 connects to Router1 G0/0 at 192.168.0.2/30; Router1 retains both return routes.</desc><rect width="1120" height="710" fill="#ffffff" /><text x="22" y="30" fill="#17364c" font-size="20" text-anchor="start" font-weight="bold">Lab 4 topology — schematic</text><rect x="20" y="65" width="310" height="155" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="175" y="96" fill="#17364c" font-size="20" text-anchor="middle" font-weight="bold">Router0 supplies DHCP</text><text x="175" y="126" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Pools: VLAN10, VLAN20</text><text x="175" y="156" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Exclude .1–.10 in each /24</text><text x="175" y="186" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">DNS option: 8.8.8.8</text><line x1="760" y1="120" x2="820" y2="120" stroke="#7c4e91" stroke-width="4" /><text x="920" y="35" fill="#7c4e91" font-size="17" text-anchor="middle" font-weight="normal">Transit: 192.168.0.0/30</text><rect x="360.0" y="65" width="400" height="155" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="560" y="94" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Router0 (Cisco 2911)</text><text x="560" y="124" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/1: 192.168.0.1/30</text><text x="560" y="154" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0.10: 192.168.10.1/24</text><text x="560" y="184" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0.20: 192.168.20.1/24</text><rect x="820.0" y="65" width="280" height="155" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="960" y="94" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Router1 (Cisco 2911)</text><text x="960" y="124" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0: 192.168.0.2/30</text><text x="960" y="154" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Return to VLAN 10/20</text><text x="960" y="184" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">via 192.168.0.1</text><line x1="560" y1="220" x2="560" y2="345" stroke="#235fa4" stroke-width="4" /><text x="580" y="250" fill="#17364c" font-size="18" text-anchor="start" font-weight="normal">Router0 G0/0 (no parent IP)</text><text x="580" y="325" fill="#17364c" font-size="18" text-anchor="start" font-weight="normal">Switch0 Gi0/1</text><text x="540" y="285" fill="#235fa4" font-size="18" text-anchor="end" font-weight="normal">802.1Q trunk</text><text x="540" y="310" fill="#235fa4" font-size="16" text-anchor="end" font-weight="normal">Tagged VLANs 10, 20</text><rect x="390.0" y="345" width="340" height="78" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="560" y="374" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Switch0 (Cisco 2960)</text><text x="560" y="404" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Access ports Fa0/1–Fa0/4</text><line x1="560" y1="423" x2="560" y2="460" stroke="#36728b" stroke-width="3" /><line x1="140" y1="460" x2="980" y2="460" stroke="#36728b" stroke-width="3" /><rect x="20" y="480" width="530" height="172" rx="12" fill="#edf7fa" stroke="#7ba7b7" stroke-width="2" /><rect x="570" y="480" width="530" height="172" rx="12" fill="#fff5e8" stroke="#bba07d" stroke-width="2" /><text x="285" y="501" fill="#17364c" font-size="20" text-anchor="middle" font-weight="bold">Sales — VLAN 10</text><text x="835" y="501" fill="#17364c" font-size="20" text-anchor="middle" font-weight="bold">HR — VLAN 20</text><line x1="140" y1="460" x2="140" y2="530" stroke="#36728b" stroke-width="3" /><text x="152" y="524" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Fa0/1</text><rect x="25.0" y="530" width="230" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="140" y="559" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC1 (PC-PT)</text><text x="140" y="589" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">DHCP: 192.168.10.x/24</text><text x="140" y="619" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="420" y1="460" x2="420" y2="530" stroke="#36728b" stroke-width="3" /><text x="432" y="524" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Fa0/2</text><rect x="305.0" y="530" width="230" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="420" y="559" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC2 (PC-PT)</text><text x="420" y="589" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">DHCP: 192.168.10.x/24</text><text x="420" y="619" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="700" y1="460" x2="700" y2="530" stroke="#36728b" stroke-width="3" /><text x="712" y="524" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Fa0/3</text><rect x="585.0" y="530" width="230" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="700" y="559" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC3 (PC-PT)</text><text x="700" y="589" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">DHCP: 192.168.20.x/24</text><text x="700" y="619" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="980" y1="460" x2="980" y2="530" stroke="#36728b" stroke-width="3" /><text x="992" y="524" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Fa0/4</text><rect x="865.0" y="530" width="230" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="980" y="559" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC4 (PC-PT)</text><text x="980" y="589" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">DHCP: 192.168.20.x/24</text><text x="980" y="619" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><text x="22" y="680" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">PC gateways: Sales 192.168.10.1; HR 192.168.20.1. Read actual leases with ipconfig.</text><text x="22" y="703" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">All cables are copper straight-through. No Internet path is added.</text></svg>