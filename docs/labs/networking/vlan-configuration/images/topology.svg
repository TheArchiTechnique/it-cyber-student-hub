<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title description" font-family="Arial, sans-serif"><title id="title">Lab 2: VLAN Configuration</title><desc id="description">PC1 and PC2 connect to Switch0 FastEthernet0/1 and 0/2 in VLAN 10. PC3 and PC4 connect to FastEthernet0/3 and 0/4 in VLAN 20. Switch0 GigabitEthernet0/1 trunks to Router0 GigabitEthernet0/0; subinterfaces .10 and .20 provide the VLAN gateways.</desc><rect width="1120" height="660" fill="#ffffff" /><text x="22" y="28" fill="#17364c" font-size="20" text-anchor="start" font-weight="bold">Lab 2 topology</text><rect x="20" y="454" width="530" height="172" rx="12" fill="#edf7fa" stroke="#7ba7b7" stroke-width="2" /><rect x="570" y="454" width="530" height="172" rx="12" fill="#fff5e8" stroke="#bba07d" stroke-width="2" /><text x="285" y="481" fill="#17364c" font-size="20" text-anchor="middle" font-weight="bold">Sales — VLAN 10</text><text x="835" y="481" fill="#17364c" font-size="20" text-anchor="middle" font-weight="bold">HR — VLAN 20</text><line x1="560" y1="205" x2="560" y2="315" stroke="#235fa4" stroke-width="4" /><text x="580" y="238" fill="#17364c" font-size="18" text-anchor="start" font-weight="normal">Router0 G0/0</text><text x="580" y="298" fill="#17364c" font-size="18" text-anchor="start" font-weight="normal">Switch0 G0/1</text><text x="540" y="268" fill="#235fa4" font-size="18" text-anchor="end" font-weight="normal">802.1Q trunk</text><text x="540" y="291" fill="#235fa4" font-size="16" text-anchor="end" font-weight="normal">Tagged VLANs 10, 20</text><line x1="560" y1="393" x2="560" y2="430" stroke="#36728b" stroke-width="3" /><line x1="140" y1="430" x2="980" y2="430" stroke="#36728b" stroke-width="3" /><line x1="140" y1="430" x2="140" y2="500" stroke="#36728b" stroke-width="3" /><text x="150" y="495" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">F0/1</text><rect x="25.0" y="500" width="230" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="140" y="529" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC1 (PC-PT)</text><text x="140" y="559" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">192.168.10.2/24</text><text x="140" y="589" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="420" y1="430" x2="420" y2="500" stroke="#36728b" stroke-width="3" /><text x="430" y="495" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">F0/2</text><rect x="305.0" y="500" width="230" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="420" y="529" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC2 (PC-PT)</text><text x="420" y="559" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">192.168.10.3/24</text><text x="420" y="589" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="700" y1="430" x2="700" y2="500" stroke="#36728b" stroke-width="3" /><text x="710" y="495" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">F0/3</text><rect x="585.0" y="500" width="230" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="700" y="529" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC3 (PC-PT)</text><text x="700" y="559" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">192.168.20.2/24</text><text x="700" y="589" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="980" y1="430" x2="980" y2="500" stroke="#36728b" stroke-width="3" /><text x="990" y="495" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">F0/4</text><rect x="865.0" y="500" width="230" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="980" y="529" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC4 (PC-PT)</text><text x="980" y="559" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">192.168.20.3/24</text><text x="980" y="589" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><rect x="390.0" y="315" width="340" height="78" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="560" y="344" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Switch0 (Cisco 2960)</text><text x="560" y="374" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Access ports F0/1–F0/4</text><rect x="350.0" y="50" width="420" height="155" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="560" y="79" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Router0 (Cisco 2911)</text><text x="560" y="109" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0: no physical IP address</text><text x="560" y="139" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0.10: 192.168.10.1/24</text><text x="560" y="169" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0.20: 192.168.20.1/24</text><text x="22" y="650" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">All links use copper straight-through. PC gateways: Sales 192.168.10.1; HR 192.168.20.1.</text></svg>