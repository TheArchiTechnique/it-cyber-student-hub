<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title description" font-family="Arial, sans-serif"><title id="title">Lab 1: Basic Network Configuration</title><desc id="description">Three PCs connect to Switch0 in 192.168.1.0/24. Switch0 GigabitEthernet0/1 connects to Router0 GigabitEthernet0/0 at 192.168.1.1/24. All four cables are copper straight-through.</desc><rect width="1120" height="560" fill="#ffffff" /><text x="22" y="28" fill="#17364c" font-size="20" text-anchor="start" font-weight="bold">Lab 1 topology</text><line x1="560" y1="170" x2="560" y2="280" stroke="#36728b" stroke-width="3" /><text x="580" y="205" fill="#17364c" font-size="18" text-anchor="start" font-weight="normal">Router0 G0/0</text><text x="580" y="258" fill="#17364c" font-size="18" text-anchor="start" font-weight="normal">Switch0 G0/1</text><line x1="560" y1="360" x2="560" y2="390" stroke="#36728b" stroke-width="3" /><line x1="210" y1="390" x2="910" y2="390" stroke="#36728b" stroke-width="3" /><line x1="210" y1="390" x2="210" y2="430" stroke="#36728b" stroke-width="3" /><text x="222" y="418" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Switch F0/1</text><rect x="75.0" y="430" width="270" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="210" y="459" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC1 (PC-PT)</text><text x="210" y="489" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">192.168.1.2/24</text><text x="210" y="519" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="560" y1="390" x2="560" y2="430" stroke="#36728b" stroke-width="3" /><text x="572" y="418" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Switch F0/2</text><rect x="425.0" y="430" width="270" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="560" y="459" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC2 (PC-PT)</text><text x="560" y="489" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">192.168.1.3/24</text><text x="560" y="519" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><line x1="910" y1="390" x2="910" y2="430" stroke="#36728b" stroke-width="3" /><text x="922" y="418" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Switch F0/3</text><rect x="775.0" y="430" width="270" height="104" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="910" y="459" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">PC3 (PC-PT)</text><text x="910" y="489" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">192.168.1.4/24</text><text x="910" y="519" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">FastEthernet0</text><rect x="380.0" y="65" width="360" height="105" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="560" y="94" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Router0 (Cisco 2911)</text><text x="560" y="124" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">G0/0: 192.168.1.1/24</text><rect x="390.0" y="280" width="340" height="80" rx="12" fill="#f4f8fb" stroke="#36728b" stroke-width="2" /><text x="560" y="309" fill="#17364c" font-size="21" text-anchor="middle" font-weight="bold">Switch0 (Cisco 2960)</text><text x="560" y="339" fill="#17364c" font-size="18" text-anchor="middle" font-weight="normal">Default access VLAN 1</text><text x="22" y="553" fill="#17364c" font-size="16" text-anchor="start" font-weight="normal">Copper straight-through on all links. PC default gateway: 192.168.1.1.</text></svg>