name: Validate student hub
on:
  pull_request:
    branches: [main]
  push:
    branches: [build/initial-student-hub]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/sync_navigation.py --check
      - run: python scripts/check_source.py
      - run: mkdocs build --strict
      - run: python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: student-hub-preview
          path: site/
          retention-days: 7
