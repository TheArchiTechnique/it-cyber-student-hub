name: Validate student hub
on:
  pull_request:
    branches: [main]
  push:
    branches: [build/initial-student-hub, feature/centralized-pbq-library, feature/pbq-catalog-certification-integration, feature/automatic-content-visibility]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/sync_pbq_listings.py --check
      - run: python scripts/sync_navigation.py --check
      - run: python scripts/check_source.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/pbq-catalog.mjs
      - run: mkdocs build --strict
      - run: python scripts/check_pbq_catalog.py --site-dir site
      - run: python scripts/check_site.py
      - run: node tests/hub-analytics.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: student-hub-preview
          path: site/
          retention-days: 7
