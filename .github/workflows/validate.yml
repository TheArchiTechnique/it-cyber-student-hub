name: Validate student hub
on:
  pull_request:
    branches: [main]
  push:
    branches: [content/a-plus-core2-malware-investigation-remediation, improve/a-plus-core2-phishing-pbq-workflow, content/a-plus-core2-phishing-email-pbq, feature/a-plus-core2-linux-terminal-simulator, feature/learning-resource-navigation-ux, build/initial-student-hub, feature/centralized-pbq-library, feature/pbq-catalog-certification-integration, feature/global-pbq-library, feature/automatic-content-visibility, content/virtualbox-linux-mint-shared-lab, content/a-plus-core2-network-configuration-concepts, content/a-plus-core2-windows-command-practice, content/a-plus-core2-windows-troubleshooting-pbq, content/a-plus-core2-startup-bsod-pbqs, content/a-plus-core2-linux-mint-command-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/sync_pbq_listings.py --check
      - run: python scripts/sync_navigation.py --check
      - run: python scripts/check_source.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/pbq-catalog.mjs
      - run: mkdocs build --strict
      - run: python scripts/check_pbq_catalog.py --site-dir site
      - run: python scripts/check_site.py
      - run: node tests/hub-analytics.cjs
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:learning-resource-navigation
      - run: npm run test:pbq-library
      - run: node tests/network-configuration-concepts.cjs
      - run: node tests/shared-linux-lab.cjs
      - run: npm run test:linux-command-reference
      - run: npm run test:linux-mint-command-lab
      - run: npm run test:linux-terminal
      - run: npm run test:windows-command-lab
      - run: npm run test:windows-troubleshooting
      - run: npm run test:windows-startup-recovery
      - run: npm run test:windows-bsod-application
      - run: npm run test:phishing-email-investigation
      - run: npm run test:malware-investigation-remediation
      - uses: actions/upload-artifact@v4
        with:
          name: student-hub-preview
          path: site/
          retention-days: 7
