      - Objective Breakdown: certifications/comptia/a-plus-core-1/objective-breakdown.md
    - A+ Core 2: certifications/comptia/a-plus-core-2/README.md
    - Network+: certifications/comptia/network-plus/README.md
    - Security+: certifications/comptia/security-plus/README.md
    - CySA+: certifications/comptia/cysa-plus/README.md
