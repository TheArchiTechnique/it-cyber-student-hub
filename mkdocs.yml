site_name: IT & Cybersecurity Student Hub
site_description: Certification study, shared IT knowledge, labs, practice, tools,
  and quick reference.
site_url: https://thearchitechnique.github.io/it-cyber-student-hub/
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  favicon: assets/images/favicon.svg
  icon:
    logo: material/book-open-page-variant-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - search.suggest
  - search.highlight
plugins:
- search
markdown_extensions:
- tables
- fenced_code
- toc
hooks:
- scripts/site_hooks.py
extra_css:
- assets/stylesheets/hub.css
extra_javascript:
- assets/javascripts/hub-analytics.js
exclude_docs: assets/**/README.md
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn
extra:
  generator: false
nav:
- Home: README.md
- Certifications:
  - Overview: certifications/README.md
  - CompTIA:
    - Overview: certifications/comptia/README.md
